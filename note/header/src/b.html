<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="/fonts/node_modules/@fontsource/zen-kaku-gothic-new/900.css">
<link rel="stylesheet" href="/fonts/node_modules/@fontsource/zen-kaku-gothic-new/700.css">
<link rel="stylesheet" href="/fonts/node_modules/@fontsource/ibm-plex-mono/500.css">
<style>
  html, body { margin: 0; }
  body {
    width: 1280px; height: 670px; overflow: hidden; position: relative;
    background: #f2f4f7; color: #121722;
    font-family: "Zen Kaku Gothic New", "IPAGothic", sans-serif;
  }
  .left { position: absolute; left: 84px; top: 70px; }
  .kicker { font-family: "IBM Plex Mono", monospace; font-size: 22px; letter-spacing: 0.12em; color: #5b6576; }
  .lead { font-weight: 900; font-size: 72px; line-height: 1; margin-top: 34px; }
  .big { position: relative; margin-top: 6px; display: inline-block; line-height: 1; }
  .big .num { font-weight: 900; font-size: 330px; letter-spacing: -0.02em; position: relative; z-index: 1; }
  .big .unit { font-weight: 900; font-size: 120px; position: relative; z-index: 1; margin-left: 6px; }
  .big::after {
    content: ""; position: absolute; left: -8px; right: -10px; bottom: 34px; height: 92px;
    background: #ffd84d; z-index: 0;
  }
  .right { position: absolute; left: 760px; top: 96px; width: 440px; }
  .label { font-weight: 700; font-size: 21px; line-height: 1.6; color: #3a4354; }
  .grid { display: grid; grid-template-columns: repeat(10, 30px); gap: 9px; margin-top: 18px; }
  .grid i { width: 30px; height: 30px; border-radius: 3px; background: #d7dce4; display: block; }
  .grid i.on { background: #121722; }
  .legend { margin-top: 14px; font-size: 18px; font-weight: 700; color: #5b6576; }
  .legend b { display: inline-block; width: 14px; height: 14px; background: #121722; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
  .rule { height: 3px; background: #121722; margin: 40px 0 26px; width: 100%; }
  .title { font-weight: 900; font-size: 44px; line-height: 1.3; }
  .sub { margin-top: 10px; font-family: "IBM Plex Mono", monospace; font-size: 22px; letter-spacing: 0.08em; color: #5b6576; }
</style>
</head>
<body>
  <div class="left">
    <div class="kicker">2026.10.05 — 10.09</div>
    <div class="lead">5日間で</div>
    <div class="big"><span class="num">16</span><span class="unit">件</span></div>
  </div>
  <div class="right">
    <div class="label">本記事で取り上げた新規公表30件のうち<br>16件が10月5日〜9日に集中</div>
    <div class="grid" id="grid"></div>
    <div class="legend"><b></b>10/5〜10/9 の公表</div>
    <div class="rule"></div>
    <div class="title">相次ぐ情報漏えい<br>時系列まとめ</div>
    <div class="sub">2026.06 → 10.14</div>
  </div>
<script>
  // 30 disclosures in date order; positions 12-27 (1-based) fall on 10/5-10/9
  const g = document.getElementById("grid");
  for (let i = 1; i <= 30; i++) {
    const c = document.createElement("i");
    if (i >= 12 && i <= 27) c.className = "on";
    g.appendChild(c);
  }
</script>
</body>
</html>
