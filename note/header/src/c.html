<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="/fonts/node_modules/@fontsource/shippori-mincho/800.css">
<link rel="stylesheet" href="/fonts/node_modules/@fontsource/zen-kaku-gothic-new/700.css">
<link rel="stylesheet" href="/fonts/node_modules/@fontsource/ibm-plex-mono/500.css">
<style>
  html, body { margin: 0; }
  body {
    width: 1280px; height: 670px; overflow: hidden; position: relative;
    background: #ffffff; color: #141a24;
    font-family: "Zen Kaku Gothic New", "IPAGothic", sans-serif;
  }
  .left { position: absolute; left: 72px; top: 150px; width: 380px; }
  .kicker { font-family: "IBM Plex Mono", monospace; font-size: 20px; letter-spacing: 0.14em; color: #6a7384; }
  h1 { font-family: "Shippori Mincho", serif; font-weight: 800; font-size: 74px; line-height: 1.22; margin: 22px 0 0; letter-spacing: 0.02em; }
  .sub { font-weight: 700; font-size: 28px; margin-top: 22px; }
  .legend { position: absolute; left: 72px; top: 498px; display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 17px; color: #6a7384; }
  .legend i { display: inline-block; width: 20px; height: 20px; border-radius: 3px; }
  .cal-wrap { position: absolute; right: 72px; top: 150px; display: flex; gap: 36px; }
  .cal h2 { margin: 0 0 12px; font-weight: 700; font-size: 26px; }
  .cal h2 small { font-family: "IBM Plex Mono", monospace; font-size: 16px; color: #6a7384; margin-left: 8px; font-weight: 500; }
  .grid { display: grid; grid-template-columns: repeat(7, 46px); gap: 5px; position: relative; }
  .dow { font-size: 15px; font-weight: 700; color: #6a7384; text-align: center; height: 22px; }
  .cell { width: 46px; height: 46px; border-radius: 5px; position: relative; box-sizing: border-box; }
  .cell span { position: absolute; left: 6px; top: 4px; font-family: "IBM Plex Mono", monospace; font-size: 13px; }
  .cell.future { background: #ffffff; border: 1px dashed #dde1e8; color: #c3c8d2; }
  .cell.today { outline: 3px solid #141a24; outline-offset: 2px; }
  .bracket { position: absolute; border: 2px solid #141a24; border-radius: 8px; pointer-events: none; }
  .tag { position: absolute; font-weight: 700; font-size: 17px; white-space: nowrap; }
</style>
</head>
<body>
  <div class="left">
    <div class="kicker">2026.06 → 10.14</div>
    <h1>相次ぐ<br>情報漏えい</h1>
    <div class="sub">公表日で見る、2026年秋</div>
  </div>
  <div class="legend" id="legend">1日あたりの新規公表件数</div>
  <div class="cal-wrap" id="cals"></div>
<script>
  const counts = {
    "9-11": 1, "9-16": 1, "9-25": 1, "9-29": 2, "9-30": 1,
    "10-1": 1, "10-2": 1, "10-5": 4, "10-6": 4, "10-7": 2, "10-8": 2, "10-9": 4, "10-13": 3
  };
  const heat = ["#eef1f8", "#c6d0f0", "#8b9fe0", "#4a64c4", "#1d3290"];
  const ink = ["#4b5568", "#2a3550", "#ffffff", "#ffffff", "#ffffff"];
  const legend = document.getElementById("legend");
  heat.forEach((c, i) => {
    const sw = document.createElement("i"); sw.style.background = c; legend.appendChild(sw);
    const t = document.createElement("span"); t.textContent = i === 4 ? "4" : String(i); legend.appendChild(t);
  });
  const cals = document.getElementById("cals");
  function month(m, days, firstDow, label) {
    const box = document.createElement("div"); box.className = "cal";
    box.innerHTML = `<h2>${label}<small>2026</small></h2>`;
    const grid = document.createElement("div"); grid.className = "grid";
    ["日", "月", "火", "水", "木", "金", "土"].forEach(d => { const e = document.createElement("div"); e.className = "dow"; e.textContent = d; grid.appendChild(e); });
    for (let i = 0; i < firstDow; i++) grid.appendChild(document.createElement("div"));
    for (let d = 1; d <= days; d++) {
      const c = document.createElement("div"); c.className = "cell";
      const n = counts[`${m}-${d}`] || 0;
      if (m === 10 && d > 14) { c.classList.add("future"); }
      else { c.style.background = heat[n]; c.style.color = ink[n]; }
      if (m === 10 && d === 14) c.classList.add("today");
      c.innerHTML = `<span>${d}</span>`;
      c.dataset.key = `${m}-${d}`;
      grid.appendChild(c);
    }
    box.appendChild(grid); cals.appendChild(box);
    return grid;
  }
  month(9, 30, 2, "9月");
  const oct = month(10, 31, 4, "10月");
  // bracket around 10/5-10/9 (Mon-Fri row)
  const a = oct.querySelector('[data-key="10-5"]'), b = oct.querySelector('[data-key="10-9"]');
  const r = oct.getBoundingClientRect(), ra = a.getBoundingClientRect(), rb = b.getBoundingClientRect();
  const br = document.createElement("div"); br.className = "bracket";
  br.style.left = (ra.left - r.left - 5) + "px"; br.style.top = (ra.top - r.top - 5) + "px";
  br.style.width = (rb.right - ra.left + 6) + "px"; br.style.height = (ra.height + 6) + "px";
  oct.appendChild(br);
  const tag = document.createElement("div"); tag.className = "tag";
  tag.textContent = "10/5〜9日の5日間で16件";
  tag.style.right = "0px"; tag.style.top = (r.height + 18) + "px";
  oct.appendChild(tag);
  const tt = document.createElement("div"); tt.className = "tag";
  tt.textContent = "点線は10/15以降";
  tt.style.left = "0px"; tt.style.top = (r.height + 18) + "px"; tt.style.color = "#6a7384";
  oct.appendChild(tt);
</script>
</body>
</html>
