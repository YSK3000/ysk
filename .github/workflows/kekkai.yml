name: KEKKAI

on:
  push:
    paths: ["kekkai/**", ".github/workflows/kekkai.yml"]
  pull_request:
    paths: ["kekkai/**", ".github/workflows/kekkai.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kekkai-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: unit (${{ matrix.os }}, ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.10" }
          - { os: ubuntu-latest, python: "3.13" }
          - { os: macos-latest, python: "3.13" }
    defaults:
      run:
        working-directory: kekkai
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: unit tests
        env:
          KEKKAI_REQUIRE_TCPDUMP: ${{ runner.os == 'macOS' && '1' || '' }}
        run: python -m unittest discover -s tests -v
      - name: dashboard monitoring state tests
        run: node tests/test_health_ui.mjs

  macos-smoke:
    name: macOS real-machine smoke (Apple python3)
    runs-on: macos-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: kekkai
    steps:
      - uses: actions/checkout@v5
      - name: Apple-bundled Python (what a fresh Mac has)
        run: /usr/bin/python3 --version && /usr/bin/python3 -c "import ssl; print(ssl.OPENSSL_VERSION)"
      - name: unit tests on Apple python3
        env:
          KEKKAI_REQUIRE_TCPDUMP: "1"
          KEKKAI_SHOW_TCPDUMP: "1"
        run: /usr/bin/python3 -m unittest discover -s tests
      - name: real socket to authenticated API (no external calls)
        run: /usr/bin/python3 scripts/verify_live_local.py
      - name: real collectors, downloads, server, MCP
        run: /usr/bin/python3 scripts/ci_smoke.py
      - name: everyday setup (auto-start agent, always-on sensor daemon, live detection, uninstall)
        run: scripts/ci_service.sh
      - name: measure real behaviour before building on it (Tor .onion, ransomware.live API, BTM)
        run: scripts/ci_probe.sh
